<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img">
  <title>Supplier Order Ingestion Hub architecture</title>
  <desc>An FTP server holds a /greenfield directory of CSV files and a /harbor directory of XML files. The Order Intake integration polls both through one shared listener, gating on a .ok marker, maps each format to a canonical Order with the data mapper, persists to MySQL, and moves files to /processed or /errors. The Daily Summary automation reads the day's orders from MySQL and emails a report to procurement.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L7,3 L0,6 Z" fill="#64748B"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1080" height="600" fill="#ffffff"/>

  <!-- edges -->
  <g fill="none" stroke="#64748B" stroke-width="2">
    <line x1="248" y1="169" x2="350" y2="178" marker-end="url(#arrow)"/>   <!-- greenfield -> OI -->
    <line x1="248" y1="271" x2="350" y2="236" marker-end="url(#arrow)"/>   <!-- harbor -> OI -->
    <line x1="670" y1="150" x2="806" y2="150" marker-end="url(#arrow)"/>   <!-- OI -> MySQL -->
    <line x1="510" y1="330" x2="510" y2="378" marker-end="url(#arrow)"/>   <!-- OI -> archive -->
    <line x1="880" y1="218" x2="880" y2="368" marker-end="url(#arrow)"/>   <!-- MySQL -> Daily Summary -->
    <path d="M758 424 C 700 452, 692 498, 652 498" marker-end="url(#arrow)"/> <!-- Daily Summary -> Procurement -->
  </g>

  <!-- FTP server -->
  <g filter="url(#shadow)">
    <rect x="40" y="90" width="230" height="240" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  </g>
  <text x="155" y="120" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">FTP server</text>
  <g filter="url(#shadow)">
    <rect x="62" y="140" width="186" height="58" rx="10" fill="#E0F2FE" stroke="#38BDF8" stroke-width="1.5"/>
    <rect x="62" y="242" width="186" height="58" rx="10" fill="#FEF3C7" stroke="#FBBF24" stroke-width="1.5"/>
  </g>
  <text x="155" y="164" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">/greenfield</text>
  <text x="155" y="184" text-anchor="middle" font-size="12" fill="#475569">CSV + .ok</text>
  <text x="155" y="266" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">/harbor</text>
  <text x="155" y="286" text-anchor="middle" font-size="12" fill="#475569">XML + .ok</text>

  <!-- Order Intake -->
  <g filter="url(#shadow)">
    <rect x="350" y="80" width="320" height="250" rx="14" fill="#EEF2FF" stroke="#6366F1" stroke-width="1.6"/>
  </g>
  <text x="510" y="108" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Order Intake</text>
  <text x="510" y="128" text-anchor="middle" font-size="12" fill="#475569">one ftpListener · two services</text>
  <g filter="url(#shadow)">
    <rect x="372" y="150" width="276" height="44" rx="9" fill="#ffffff" stroke="#A5B4FC" stroke-width="1.4"/>
    <rect x="372" y="206" width="276" height="44" rx="9" fill="#ffffff" stroke="#A5B4FC" stroke-width="1.4"/>
  </g>
  <text x="510" y="177" text-anchor="middle" font-size="12.5" fill="#0f172a">onFileCsv  →  Data Mapper</text>
  <text x="510" y="233" text-anchor="middle" font-size="12.5" fill="#0f172a">onFileXml  →  Data Mapper</text>
  <text x="510" y="288" text-anchor="middle" font-size="13.5" font-weight="700" fill="#4338CA">→ one canonical Order</text>
  <text x="510" y="310" text-anchor="middle" font-size="11.5" fill="#475569">CSV and XML converge on the same model</text>

  <!-- MySQL cylinder -->
  <g filter="url(#shadow)">
    <path d="M810,134 V196 A70,14 0 0 0 950,196 V134" fill="#ECFDF5" stroke="#10B981" stroke-width="1.8"/>
    <ellipse cx="880" cy="134" rx="70" ry="14" fill="#ECFDF5" stroke="#10B981" stroke-width="1.8"/>
  </g>
  <text x="880" y="162" text-anchor="middle" font-size="15" font-weight="700" fill="#065F46">MySQL</text>
  <text x="880" y="182" text-anchor="middle" font-size="11.5" fill="#475569">orders · order_lines</text>
  <text x="880" y="198" text-anchor="middle" font-size="11.5" fill="#475569">(persist)</text>

  <!-- Archive -->
  <g filter="url(#shadow)">
    <rect x="372" y="380" width="276" height="56" rx="12" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  </g>
  <text x="510" y="404" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">/processed   ·   /errors</text>
  <text x="510" y="423" text-anchor="middle" font-size="11.5" fill="#475569">move on success / error</text>

  <!-- Daily Summary -->
  <g filter="url(#shadow)">
    <rect x="760" y="370" width="240" height="114" rx="14" fill="#FEF2F2" stroke="#F87171" stroke-width="1.6"/>
  </g>
  <text x="880" y="412" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Daily Summary</text>
  <text x="880" y="434" text-anchor="middle" font-size="12" fill="#475569">automation · runs on a schedule</text>
  <text x="880" y="452" text-anchor="middle" font-size="12" fill="#475569">today's orders by date</text>

  <!-- Procurement -->
  <g filter="url(#shadow)">
    <rect x="372" y="470" width="276" height="56" rx="12" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="1.5"/>
  </g>
  <text x="510" y="494" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Procurement</text>
  <text x="510" y="513" text-anchor="middle" font-size="11.5" fill="#475569">email (SMTP)</text>

  <!-- edge labels (drawn last so they sit above the boxes) -->
  <g font-size="12.5" fill="#475569" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round">
    <text x="310" y="201">poll</text>
    <text x="310" y="218">.ok gate</text>
    <text x="738" y="140">persist</text>
    <text x="548" y="360">archive</text>
    <text x="894" y="298" text-anchor="start">read today</text>
    <text x="706" y="446">email report</text>
  </g>
</svg>
