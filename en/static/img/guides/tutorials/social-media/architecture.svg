<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L7,3 L0,6 Z" fill="#64748B"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1080" height="560" fill="#ffffff"/>

  <!-- edges -->
  <g fill="none" stroke="#64748B" stroke-width="2">
    <!-- request -> API -->
    <line x1="206" y1="288" x2="248" y2="288" marker-end="url(#arrow)"/>
    <!-- API -> Sentiment (sync) -->
    <line x1="452" y1="268" x2="552" y2="120" marker-end="url(#arrow)"/>
    <!-- API -> MySQL (sync) -->
    <line x1="452" y1="288" x2="592" y2="288" marker-end="url(#arrow)"/>
    <!-- API -> RabbitMQ (async) -->
    <line x1="452" y1="312" x2="552" y2="466" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
    <!-- RabbitMQ -> Post Notifier (async) -->
    <line x1="766" y1="492" x2="832" y2="492" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
    <!-- Post Notifier -> Slack -->
    <line x1="944" y1="452" x2="944" y2="368" marker-end="url(#arrow)"/>
  </g>

  <!-- edge labels -->
  <g font-size="12.5" fill="#475569" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round">
    <text x="500" y="190">screen text</text>
    <text x="522" y="278">persist</text>
    <text x="498" y="398">publish</text>
    <text x="799" y="481">consume</text>
    <text x="965" y="414" text-anchor="start">notify</text>
  </g>

  <!-- Request -->
  <g filter="url(#shadow)">
    <rect x="26" y="258" width="180" height="60" rx="30" fill="#EEF2F7" stroke="#94A3B8" stroke-width="1.5"/>
  </g>
  <text x="116" y="293" text-anchor="middle" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#334155">POST /users/{id}/posts</text>

  <!-- Social Media API -->
  <g filter="url(#shadow)">
    <rect x="252" y="240" width="200" height="96" rx="14" fill="#E8F0FE" stroke="#2563EB" stroke-width="2"/>
  </g>
  <text x="352" y="282" text-anchor="middle" font-size="17" font-weight="700" fill="#1E3A8A">Social Media API</text>
  <text x="352" y="303" text-anchor="middle" font-size="12" fill="#64748B">HTTP service</text>
  <text x="352" y="319" text-anchor="middle" font-size="11" font-weight="600" fill="#2563EB">orchestrator</text>

  <!-- Sentiment API -->
  <g filter="url(#shadow)">
    <rect x="556" y="60" width="210" height="80" rx="14" fill="#E7F7F0" stroke="#0E9F6E" stroke-width="2"/>
  </g>
  <text x="661" y="97" text-anchor="middle" font-size="17" font-weight="700" fill="#065F46">Sentiment API</text>
  <text x="661" y="118" text-anchor="middle" font-size="12" fill="#64748B">HTTP service</text>

  <!-- MySQL cylinder -->
  <g filter="url(#shadow)">
    <path d="M598,250 V322 A62,13 0 0 0 722,322 V250" fill="#E4EFF4" stroke="#00758F" stroke-width="2"/>
    <ellipse cx="660" cy="250" rx="62" ry="13" fill="#E4EFF4" stroke="#00758F" stroke-width="2"/>
  </g>
  <text x="660" y="300" text-anchor="middle" font-size="16" font-weight="700" fill="#064F63">MySQL</text>

  <!-- RabbitMQ -->
  <g filter="url(#shadow)">
    <rect x="556" y="452" width="210" height="80" rx="14" fill="#FFF0E6" stroke="#F26B1F" stroke-width="2"/>
  </g>
  <text x="661" y="489" text-anchor="middle" font-size="17" font-weight="700" fill="#9A3412">RabbitMQ</text>
  <text x="661" y="510" text-anchor="middle" font-size="12" fill="#64748B">message broker</text>

  <!-- Post Notifier -->
  <g filter="url(#shadow)">
    <rect x="834" y="452" width="218" height="80" rx="14" fill="#F2EAFB" stroke="#7C3AED" stroke-width="2"/>
  </g>
  <text x="943" y="489" text-anchor="middle" font-size="17" font-weight="700" fill="#5B21B6">Post Notifier</text>
  <text x="943" y="510" text-anchor="middle" font-size="12" fill="#64748B">event integration</text>

  <!-- Slack -->
  <g filter="url(#shadow)">
    <rect x="864" y="304" width="160" height="62" rx="14" fill="#F8ECF6" stroke="#6B1A6E" stroke-width="2"/>
  </g>
  <text x="944" y="341" text-anchor="middle" font-size="16" font-weight="700" fill="#4A154B">Slack</text>

  <!-- legend -->
  <g font-size="12" fill="#64748B">
    <line x1="28" y1="520" x2="60" y2="520" stroke="#64748B" stroke-width="2"/>
    <text x="68" y="524">synchronous (HTTP / database)</text>
    <line x1="28" y1="542" x2="60" y2="542" stroke="#64748B" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="68" y="546">asynchronous (event)</text>
  </g>
</svg>
