name: WSO2 Integrator Docs Publish

# main is the product-agnostic template/governance branch (see
# MAINTENANCE.md) and normally isn't force-pushed to production the way
# saas, wso2-integrator, and wso2-connectors are -- but this workflow
# still fires on any ordinary push to main, so it needs the same
# multi-branch-safe deploy settings those three branches already carry,
# or the next push here wipes out whatever they've published.
#
# keep_files: true is load-bearing -- without it, peaceiris wipes the
# entire gh-pages branch before each deploy, deleting whatever the other
# branches' workflows published. The shared concurrency group prevents
# two of these workflows from racing to push gh-pages at once.

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

jobs:
  release-wso2-integrator-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Docusaurus site
        run: npm run build
        env:
          BASE_URL: /integration-platform/docs/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: en/build
          keep_files: true
