name: Staging Sync

# Keeps the `staging` branch as a continuously-updated, merged preview of
# all product branches together -- the input to whatever hosts staging
# (Choreo), and the source tree that promote_to_production.yaml later
# ships to `gh-pages` byte-for-byte. Fires on every push to a product
# branch directly, instead of waiting for a promotion event -- staging
# is meant to always be current, unlike production.
#
# This file is intentionally IDENTICAL on every product branch -- it
# reads `github.ref_name` at runtime to pick the right BASE_URL and
# staging subdirectory, so there is nothing branch-specific to
# hand-edit. It's authored on `main` (see MAINTENANCE.md) and
# distributed to every product branch by the same shared-sync automation
# that distributes the shared theme. The one time you DO edit it: adding
# a new product branch to the trigger list and the case statement below
# when that product launches.
#
# Deliberately does NOT deploy to production. See promote_to_production.yaml
# (lives on `main`) for that half of the pipeline.

on:
  push:
    branches:
      - saas
      - wso2-integrator
      - wso2-connectors
      - wso2-agent-builder
  workflow_dispatch:

# Per-branch, NOT one shared group across the four products -- see the
# long comment above the mirror step for why serializing them is worse.
concurrency:
  group: staging-deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-sync:
    runs-on: ubuntu-latest
    # The mirror step pushes to `staging` with the default token.
    permissions:
      contents: write
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Resolve this branch's BASE_URL
        id: cfg
        env:
          # Unset on the real org repo (production/staging always build
          # against the real custom-domain path). Set as a repo variable
          # on a personal fork's own GitHub Pages -- which has no custom
          # domain, so it serves everything one level deeper, under
          # /<repo-name>/ -- to point builds at that fork's own actual
          # root instead (Settings -> Secrets and variables -> Actions ->
          # Variables -> FORK_BASE_PATH, e.g. "/docs-integrator/").
          FORK_BASE_PATH: ${{ vars.FORK_BASE_PATH }}
        run: |
          family_base="${FORK_BASE_PATH:-/integration-platform/docs/}"
          case "${{ github.ref_name }}" in
            saas)
              echo "base_url=${family_base}saas/" >> "$GITHUB_OUTPUT"
              echo "product_dir=saas" >> "$GITHUB_OUTPUT"
              ;;
            wso2-integrator)
              echo "base_url=${family_base}integrator/" >> "$GITHUB_OUTPUT"
              echo "product_dir=integrator" >> "$GITHUB_OUTPUT"
              # Default Node heap isn't enough once a branch carries more
              # than one versioned_docs/ snapshot (confirmed: wso2-integrator's
              # own 5.1.0 cut crashed this build step with "JavaScript heap
              # out of memory"). Scoped to this branch only, not every
              # branch unconditionally, since the others don't carry that
              # weight yet -- add the same line to a branch's own case
              # entry here once it needs it too (e.g. after its first
              # `docs:version` cut).
              echo "node_options=--max-old-space-size=8192" >> "$GITHUB_OUTPUT"
              ;;
            wso2-connectors)
              echo "base_url=${family_base}connectors/" >> "$GITHUB_OUTPUT"
              echo "product_dir=connectors" >> "$GITHUB_OUTPUT"
              ;;
            wso2-agent-builder)
              echo "base_url=${family_base}agent-builder/" >> "$GITHUB_OUTPUT"
              echo "product_dir=agent-builder" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::No staging config for branch '${{ github.ref_name }}' -- add it to this case statement and to the trigger list above."
              exit 1
              ;;
          esac
          echo "cross_product_base=${family_base}" >> "$GITHUB_OUTPUT"

      - name: Build Docusaurus site
        run: npm run build
        env:
          BASE_URL: ${{ steps.cfg.outputs.base_url }}
          # See themeConfig.ts's CROSS_PRODUCT_BASE docstring -- without
          # this, cross-product links (navbar logo, product switcher)
          # would still point at the production family root even on a
          # fork build using FORK_BASE_PATH above for its own baseUrl.
          CROSS_PRODUCT_BASE: ${{ steps.cfg.outputs.cross_product_base }}
          # Empty string on any branch whose case entry above doesn't set
          # node_options -- harmless, Node just ignores an empty NODE_OPTIONS.
          NODE_OPTIONS: ${{ steps.cfg.outputs.node_options }}

      # Fork builds only (FORK_BASE_PATH set = a personal fork's own GitHub
      # Pages demo, not the real org pipeline): keep search engines from
      # indexing the demo until the site goes live from the official repo.
      # `noindex` in every page is what actually works -- a robots.txt
      # can't, because a project site (<owner>.github.io/<repo>/) isn't the
      # host root and crawlers only read /robots.txt from the root. The
      # sitemaps are dropped too so crawlers aren't handed a URL list.
      # Real org builds leave FORK_BASE_PATH unset, so production and the
      # Choreo staging site are never affected.
      - name: Block search engines on fork builds
        if: ${{ vars.FORK_BASE_PATH != '' }}
        run: |
          find en/build -name '*.html' -print0 | xargs -0 sed -i 's#<head>#<head><meta name="robots" content="noindex, nofollow">#'
          find en/build -name 'sitemap.xml' -delete

      - name: Prepare root redirect for this base path
        if: github.ref_name == 'saas'
        # root-redirect/index.html hardcodes the production target
        # (/integration-platform/docs/saas/) since it's a plain static
        # file, not part of the Docusaurus build. On the real org repo
        # this sed is a no-op (steps.cfg's base_url IS that exact
        # string there); on a fork with FORK_BASE_PATH set, it rewrites
        # the redirect to that fork's own resolved saas base instead of
        # shipping a link that 404s on it.
        run: |
          mkdir -p /tmp/root-redirect
          sed "s#/integration-platform/docs/saas/#${{ steps.cfg.outputs.base_url }}#g" root-redirect/index.html > /tmp/root-redirect/index.html
          # Fork builds: same noindex as the step above, for the redirect page.
          if [ -n "${{ vars.FORK_BASE_PATH }}" ]; then
            sed -i 's#<head>#<head><meta name="robots" content="noindex, nofollow">#' /tmp/root-redirect/index.html
          fi

      # Each run builds exactly ONE product, so the step below MIRRORS that
      # product's own subtree of `staging` and touches nothing else: the
      # directory is deleted and recreated from `en/build`, so a page the
      # build no longer emits stops being served. A mirror is idempotent --
      # staging/<product> equals that branch's build output by construction.
      #
      # This replaced `peaceiris/actions-gh-pages` with `keep_files: true`,
      # which only ever ADDED files: a renamed or deleted doc kept its old
      # URL alive forever. agent-builder's pre-reorg
      # `.../ai-integrations/agents/gated-tools` was still serving its
      # 2026-10-29 build two weeks after the 2026-10-30 rename, alongside
      # the page's current URL, and promote_to_production had copied it to
      # production byte-for-byte (~234 such orphans across the four
      # products). Dropping `keep_files` was never the alternative: it is
      # branch-wide, so it would have wiped the other three products and
      # the staging root along with the stale files.
      #
      # The staging ROOT is deliberately never cleaned, and the guard below
      # refuses to push if anything already there went missing. It holds
      # files no Docusaurus build can regenerate -- `Dockerfile` and
      # `nginx.conf`, hand-committed for Choreo's container, plus
      # `.nojekyll`, `.dockerignore` and saas's family root redirect -- and
      # promote_to_production would copy any such loss straight to
      # production.
      #
      # Two product branches pushing at once is handled by re-mirroring onto
      # the new tip and pushing again, NOT by a shared concurrency group:
      # GitHub keeps only ONE pending run per group, so funnelling all four
      # products into one group would let a third push cancel a second
      # product's queued deploy outright, leaving that product stale on
      # staging until its next push. Re-mirroring is safe precisely because
      # a mirror rebuilds the subtree from scratch instead of applying a
      # diff, so there is nothing to conflict.
      - name: Mirror this product's subtree onto staging
        env:
          PRODUCT: ${{ steps.cfg.outputs.product_dir }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          # Shallow single-branch clone: `staging` carries one deploy commit
          # per push over a ~30k-file tree, so its history is not worth
          # fetching. Pushing from it is still a plain fast-forward.
          if git clone --quiet --depth 1 --single-branch --branch staging "$REMOTE" /tmp/staging; then
            cd /tmp/staging
          else
            # First run on a fork with no `staging` yet (peaceiris created
            # the branch on demand). The org's hand-placed root files aren't
            # needed for a fork's own GitHub Pages, so an empty root is fine.
            echo "No staging branch yet -- bootstrapping an empty one."
            mkdir -p /tmp/staging
            cd /tmp/staging
            git init --quiet --initial-branch staging
            git remote add origin "$REMOTE"
            touch .nojekyll
          fi
          git config user.name "Docs Bot"
          git config user.email "docs@wso2.com"

          mirror_and_commit() {
            # Recomputed per attempt: on a retry HEAD is the new remote tip,
            # which may legitimately carry root files this run hasn't seen.
            root_blobs=""
            if git rev-parse --verify --quiet HEAD >/dev/null; then
              root_blobs="$(git ls-tree HEAD | awk '$2 == "blob"' | cut -f2)"
            fi

            rm -rf "$PRODUCT"
            mkdir -p "$PRODUCT"
            cp -a "$GITHUB_WORKSPACE/en/build/." "$PRODUCT/"
            # peaceiris added this per deploy; `docusaurus build` does not
            # emit it, and without it GitHub Pages runs Jekyll on production
            # and silently drops any path with a leading underscore.
            touch "$PRODUCT/.nojekyll"
            if [ "$PRODUCT" = "saas" ]; then
              cp /tmp/root-redirect/index.html index.html
            fi

            while read -r f; do
              if [ -n "$f" ] && [ ! -f "$f" ]; then
                echo "::error::staging root lost '$f' -- refusing to push"
                exit 1
              fi
            done <<< "$root_blobs"

            # A build that silently produced nothing must not be mirrored
            # over a good one -- an empty mirror would delete the live product.
            if [ ! -f "$PRODUCT/index.html" ]; then
              echo "::error::build produced no $PRODUCT/index.html -- refusing to push"
              exit 1
            fi
            pages="$(find "$PRODUCT" -name '*.html' | wc -l)"
            if [ "$pages" -lt 50 ]; then
              echo "::error::only $pages HTML pages built for $PRODUCT -- refusing to push"
              exit 1
            fi
            echo "Mirroring $pages pages into staging/$PRODUCT."

            git add -A
            if git diff --cached --quiet; then
              echo "staging/$PRODUCT already matches this build -- nothing to push."
              exit 0
            fi
            git commit --quiet -m "deploy($PRODUCT): ${GITHUB_SHA}"
          }

          for attempt in 1 2 3; do
            mirror_and_commit
            if git push --quiet origin "HEAD:staging"; then
              echo "Pushed staging/$PRODUCT on attempt $attempt."
              exit 0
            fi
            echo "staging moved under us -- re-mirroring onto the new tip."
            git fetch --quiet --depth 1 origin staging
            git reset --quiet --hard FETCH_HEAD
          done
          echo "::error::could not push to staging after 3 attempts"
          exit 1
